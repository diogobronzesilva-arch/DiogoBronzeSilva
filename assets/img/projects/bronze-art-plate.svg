    <rect x="728" y="286" width="174" height="36" fill="#F4EFE6" stroke="#191814" stroke-opacity="0.14" stroke-width="1"/>
    <text x="815" y="302" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="1.1" fill="#191814" font-weight="500">INTERNAL ARCHIVE</text>
    <text x="815" y="315" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#56534C">Separate retention decision</text>

    <text x="516" y="366" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1.2" fill="#746E63">FOLDER UPLOAD · RESUMABLE TRANSFER · PRIVATE DELIVERY</text>
