    <text x="444" y="46" text-anchor="end" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1.2" fill="#746E63">3:2 CLASSICAL</text>

    <!-- Classical 3:2 matte frame -->
    <rect x="36" y="66" width="408" height="272" fill="#FBFAF7" stroke="#191814" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Inner photograph window -->
    <rect x="64" y="92" width="352" height="214" fill="#EAE4D8" stroke="#191814" stroke-opacity="0.16" stroke-width="1"/>
