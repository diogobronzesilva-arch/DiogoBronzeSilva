      <rect x="722" y="106" width="84" height="54" fill="#EFEAE0" stroke="#191814" stroke-opacity="0.16" stroke-width="1"/>
      <rect x="814" y="106" width="88" height="54" fill="#EFEAE0" stroke="#191814" stroke-opacity="0.16" stroke-width="1"/>
    </g>

    <!-- Chapter 02 -->
    <text x="538" y="186" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" letter-spacing="1.2" fill="#8A6A3C" font-weight="500">CHAPTER 02 · THE SACRAMENT</text>
    <text x="902" y="186" text-anchor="end" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#746E63">Album Selection Active</text>
    <g>
      <rect x="538" y="196" width="84" height="54" fill="#EFEAE0" stroke="#8A6A3C" stroke-width="1.3"/>
      <circle cx="610" cy="208" r="5" fill="#8A6A3C"/>
      <rect x="630" y="196" width="84" height="54" fill="#EFEAE0" stroke="#191814" stroke-opacity="0.16" stroke-width="1"/>
      <rect x="722" y="196" width="84" height="54" fill="#EFEAE0" stroke="#191814" stroke-opacity="0.16" stroke-width="1"/>
      <rect x="814" y="196" width="88" height="54" fill="#EFEAE0" stroke="#8A6A3C" stroke-width="1.3"/>
      <circle cx="890" cy="208" r="5" fill="#8A6A3C"/>
    </g>

    <!-- Governance separation bar -->
    <line x1="538" y1="274" x2="902" y2="274" stroke="#191814" stroke-opacity="0.16" stroke-width="1"/>
    <rect x="538" y="286" width="174" height="36" fill="#F4EFE6" stroke="#191814" stroke-opacity="0.14" stroke-width="1"/>
    <text x="625" y="302" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="1.1" fill="#8A6A3C" font-weight="500">CLIENT ACCESS</text>
