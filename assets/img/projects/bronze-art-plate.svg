    <text x="538" y="96" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" letter-spacing="1.2" fill="#8A6A3C" font-weight="500">CHAPTER 01 · PREPARATION</text>
    <text x="902" y="96" text-anchor="end" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#746E63">Original JPEGs · ZIP on demand</text>
