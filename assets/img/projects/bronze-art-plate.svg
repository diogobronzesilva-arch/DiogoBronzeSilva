    <text x="516" y="46" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="1.6" fill="#8A6A3C" font-weight="500">II · BRONZE ART GALLERIES — CLIENT DELIVERY</text>
    <text x="924" y="46" text-anchor="end" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1.2" fill="#746E63">WEB APP</text>

