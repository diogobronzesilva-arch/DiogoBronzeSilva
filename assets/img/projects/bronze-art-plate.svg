    <path d="M 64 106 L 64 92 L 78 92 M 402 92 L 416 92 L 416 106 M 64 292 L 64 306 L 78 306 M 402 306 L 416 306 L 416 292" fill="none" stroke="#8A6A3C" stroke-width="1.5"/>
    <!-- Minimalist documentary horizon & architectural light -->
    <line x1="64" y1="234" x2="416" y2="234" stroke="#191814" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="196" y="130" width="88" height="104" fill="#FBFAF7" fill-opacity="0.65" stroke="#191814" stroke-opacity="0.24" stroke-width="1"/>
    <line x1="240" y1="130" x2="240" y2="234" stroke="#191814" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="240" cy="182" r="22" fill="none" stroke="#8A6A3C" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="240" y="272" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#56534C">Light, natural gesture, and what stays thirty years later</text>

    <!-- Archival tonal step-wedge I-X -->
    <g transform="translate(64, 316)">
      <rect x="0" y="0" width="32" height="8" fill="#191814"/>
      <rect x="35" y="0" width="32" height="8" fill="#322F28"/>
      <rect x="70" y="0" width="32" height="8" fill="#4D4940"/>
      <rect x="105" y="0" width="32" height="8" fill="#686358"/>
      <rect x="140" y="0" width="32" height="8" fill="#8A6A3C"/>
      <rect x="175" y="0" width="32" height="8" fill="#9E978B"/>
      <rect x="210" y="0" width="32" height="8" fill="#B7B0A4"/>
      <rect x="245" y="0" width="32" height="8" fill="#CFC8BC"/>
      <rect x="280" y="0" width="32" height="8" fill="#E3DDD2"/>
      <rect x="315" y="0" width="37" height="8" fill="#FBFAF7" stroke="#191814" stroke-opacity="0.2" stroke-width="0.8"/>
    </g>

    <text x="36" y="366" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1.2" fill="#746E63">FAMILY · FAITH · SACRAMENTS · BRONZEART.PT</text>
  </g>

  <!-- Right sheet: II · Bronze Art Galleries Client Delivery -->
