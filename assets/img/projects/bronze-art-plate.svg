<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Bronze Art and Galleries editorial plate showing 3:2 documentary frame and chapter-based client delivery workflow">
  <rect width="960" height="400" fill="#F6F3EC"/>
  <line x1="480" y1="24" x2="480" y2="376" stroke="#191814" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Left sheet: I · Bronze Art Documentary Frame -->
  <g>
