<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" width="640" height="548" role="img" aria-labelledby="tl-pt-title tl-pt-desc">
  <title id="tl-pt-title">Evolução dos benefícios laborais em Portugal (1824–2026)</title>
  <desc id="tl-pt-desc">Cronologia vertical em cinco etapas dos benefícios laborais em Portugal: 01 Vista Alegre (1824), 02 CUF e Alfredo da Silva (1907–1945), 03 Lei fiscal e vales em papel (1977–1999), 04 Cartão de refeição com flexibilidade fragmentada (anos 2010) e 05 Coverflex a democratizar benefícios flexíveis pela tecnologia (2019–hoje).</desc>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="639" height="547" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="32" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" fill="#746E63">FIGURA 01 · DOIS SÉCULOS DE BENEFÍCIOS LABORAIS EM PORTUGAL</text>
  <text x="28" y="51" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13.5" fill="#56534C">Dos bairros operários físicos às isenções fiscais e, por fim, a uma plataforma única</text>
  <line x1="28" y1="64" x2="612" y2="64" stroke="#E5E0D7" stroke-width="1"/>

  <!-- Vertical timeline spine -->
  <line x1="52" y1="116" x2="52" y2="476" stroke="#C9B28B" stroke-width="1.5"/>

  <!-- Etapa 01 -->
  <circle cx="52" cy="116" r="14" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="120.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8A6A3C">01</text>
  <rect x="82" y="80" width="530" height="72" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="98" y="101" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">1824 · VISTA ALEGRE (ÍLHAVO)</text>
  <text x="98" y="122" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">Os primeiros bairros, escola e saúde junto à fábrica</text>
  <text x="98" y="141" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#746E63">Habitação operária, alfabetização e creche muito antes de existir Estado Social</text>

  <!-- Etapa 02 -->
  <circle cx="52" cy="204" r="14" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="208.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8A6A3C">02</text>
  <rect x="82" y="168" width="530" height="72" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="98" y="189" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">1907–1945 · CUF &amp; ALFREDO DA SILVA</text>
  <text x="98" y="210" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">A Obra Social levada à escala industrial no Barreiro</text>
  <text x="98" y="229" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#746E63">Cantinas subsidiadas, cooperativas e Hospital da CUF (1945) — só para gigantes</text>

  <!-- Etapa 03 -->
  <circle cx="52" cy="292" r="14" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="296.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8A6A3C">03</text>
  <rect x="82" y="256" width="530" height="72" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="98" y="277" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">1977–1999 · LEI FISCAL &amp; VALES EM PAPEL</text>
  <text x="98" y="298" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">Enquadramento do subsídio de refeição e vales de infância</text>
  <text x="98" y="317" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#746E63">Decretos-Lei 305/77, 297/79, 57-B/84; títulos nos anos 80; DL 26/99 (creches)</text>

  <!-- Etapa 04 -->
  <circle cx="52" cy="380" r="14" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="384.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8A6A3C">04</text>
  <rect x="82" y="344" width="530" height="72" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="98" y="365" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">ANOS 2010 · CARTÃO DE REFEIÇÃO</text>
  <text x="98" y="386" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">O papel digitaliza-se na alimentação, mas o resto trava</text>
  <text x="98" y="405" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#746E63">Desde 2013 o cartão substitui talões; benefícios amplos ficam presos a vários canais</text>

  <!-- Etapa 05 -->
  <circle cx="52" cy="468" r="14" fill="#8A6A3C" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="472.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FBFAF7">05</text>
  <rect x="82" y="432" width="530" height="74" fill="#F5F2EB" stroke="#8A6A3C" stroke-width="1"/>
  <text x="98" y="453" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">2019–HOJE · COVERFLEX &amp; DEMOCRATIZAÇÃO</text>
  <text x="98" y="474" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">Uma só plataforma traz nível enterprise a empresas de qualquer dimensão</text>
  <text x="98" y="493" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#56534C">Carteira digital única, rigor fiscal determinístico e escolha real para PMEs e grandes equipas</text>

  <!-- Footer note -->
  <text x="28" y="530" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#746E63">A intenção manteve-se estável dois séculos; o software eliminou a barreira da escala.</text>
</svg>
