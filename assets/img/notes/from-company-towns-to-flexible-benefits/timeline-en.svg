<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" width="640" height="548" role="img" aria-labelledby="tl-en-title tl-en-desc">
  <title id="tl-en-title">Evolution of employee benefits in Portugal (1824–2026)</title>
  <desc id="tl-en-desc">Five-stage vertical timeline of employee benefits in Portugal: 01 Vista Alegre (1824), 02 CUF and Alfredo da Silva (1907–1945), 03 Tax law and paper vouchers (1977–1999), 04 Prepaid meal cards while flexibility stalled (2010s), and 05 Coverflex democratising flexible benefits through technology (2019–today).</desc>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="639" height="547" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="32" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" fill="#746E63">FIGURE 01 · TWO CENTURIES OF EMPLOYEE BENEFITS IN PORTUGAL</text>
  <text x="28" y="51" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13.5" fill="#56534C">From brick-and-mortar company towns to statutory exemptions, and finally unified software</text>
  <line x1="28" y1="64" x2="612" y2="64" stroke="#E5E0D7" stroke-width="1"/>

  <!-- Vertical timeline spine -->
  <line x1="52" y1="116" x2="52" y2="476" stroke="#C9B28B" stroke-width="1.5"/>

  <!-- Stage 01 -->
  <circle cx="52" cy="116" r="14" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="120.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8A6A3C">01</text>
  <rect x="82" y="80" width="530" height="72" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="98" y="101" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">1824 · VISTA ALEGRE (ÍLHAVO)</text>
  <text x="98" y="122" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">Early company housing, school and healthcare around the factory</text>
  <text x="98" y="141" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#746E63">Workers’ cottages, literacy classes and nursery long before a public welfare state</text>

  <!-- Stage 02 -->
  <circle cx="52" cy="204" r="14" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="208.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8A6A3C">02</text>
  <rect x="82" y="168" width="530" height="72" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="98" y="189" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">1907–1945 · CUF &amp; ALFREDO DA SILVA</text>
  <text x="98" y="210" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">The Obra Social scaled across Barreiro and major industrial hubs</text>
  <text x="98" y="229" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#746E63">Subsidised canteens, cooperatives and CUF Hospital (1945) — limited to giants</text>

  <!-- Stage 03 -->
  <circle cx="52" cy="292" r="14" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="296.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8A6A3C">03</text>
  <rect x="82" y="256" width="530" height="72" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="98" y="277" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">1977–1999 · STATUTORY TAX LAW &amp; PAPER VOUCHERS</text>
  <text x="98" y="298" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">Meal allowance decrees and social childcare vouchers</text>
  <text x="98" y="317" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#746E63">Decrees 305/77, 297/79, 57-B/84; paper meal tickets in the 1980s; DL 26/99 (childcare)</text>

  <!-- Stage 04 -->
  <circle cx="52" cy="380" r="14" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="384.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8A6A3C">04</text>
  <rect x="82" y="344" width="530" height="72" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="98" y="365" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">2010s · PREPAID MEAL CARDS</text>
  <text x="98" y="386" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">Meal cards digitise, yet broader flexibility stalls</text>
  <text x="98" y="405" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#746E63">From 2013 cards replace paper booklets; wider benefits stay split across vendors</text>

  <!-- Stage 05 -->
  <circle cx="52" cy="468" r="14" fill="#8A6A3C" stroke="#8A6A3C" stroke-width="1.5"/>
  <text x="52" y="472.5" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FBFAF7">05</text>
  <rect x="82" y="432" width="530" height="74" fill="#F5F2EB" stroke="#8A6A3C" stroke-width="1"/>
  <text x="98" y="453" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8A6A3C">2019–TODAY · COVERFLEX &amp; DEMOCRATISATION</text>
  <text x="98" y="474" font-family="Newsreader, Georgia, serif" font-size="15" fill="#191814">One financial platform brings enterprise benefits to every company</text>
  <text x="98" y="493" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#56534C">Unified digital wallet, deterministic fiscal rules and individual choice for SMEs &amp; enterprises</text>

  <!-- Footer note -->
  <text x="28" y="530" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#746E63">The intent stayed constant for two centuries; software removed the scale barrier.</text>
</svg>
