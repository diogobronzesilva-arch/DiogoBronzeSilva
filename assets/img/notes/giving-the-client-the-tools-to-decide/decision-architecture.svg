<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" width="640" height="452" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">The Enterprise Decision Architecture</title>
  <desc id="fig1-desc">Diagram comparing why enterprise deals stall in no decision—due to unmeasured attrition costs and operational anxiety—with a two-pillar approach combining a CFO Business Case and an HR and Operations Execution Blueprint leading to an informed committee decision.</desc>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#746E63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#8A6A3C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="639" height="451" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>

  <!-- Eyebrow -->
  <text x="28" y="32" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" fill="#746E63">FIGURE 01 · THE ENTERPRISE DECISION ARCHITECTURE</text>
  <line x1="28" y1="44" x2="612" y2="44" stroke="#E5E0D7" stroke-width="1"/>

  <!-- Top Band: The No-Decision Trap -->
  <rect x="28" y="58" width="584" height="104" fill="#F5F2EB" stroke="#E2DDD3" stroke-width="1"/>
  <text x="44" y="79" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#746E63">DEFAULT OUTCOME · WHY MOST LARGE DEALS STALL</text>

  <!-- Trap Box 1 -->
  <rect x="44" y="92" width="166" height="54" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="56" y="114" font-family="Newsreader, Georgia, serif" font-size="14.5" font-weight="600" fill="#191814">Invisible attrition</text>
  <text x="56" y="133" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#56534C">Cost stays off the P&amp;L</text>

  <!-- Plus sign -->
  <text x="225" y="124" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="500" fill="#746E63">+</text>

  <!-- Trap Box 2 -->
  <rect x="240" y="92" width="166" height="54" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <text x="252" y="114" font-family="Newsreader, Georgia, serif" font-size="14.5" font-weight="600" fill="#191814">Transition anxiety</text>
  <text x="252" y="133" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.2" fill="#56534C">HR &amp; Payroll fear risk</text>

  <!-- Arrow to Status Quo -->
  <line x1="412" y1="119" x2="434" y2="119" stroke="#746E63" stroke-width="1.3" marker-end="url(#arrow-ink)"/>

  <!-- Trap Box 3 (Dashed) -->
  <rect x="442" y="92" width="154" height="54" fill="#FBFAF7" stroke="#8A6A3C" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="454" y="114" font-family="Newsreader, Georgia, serif" font-size="14.5" font-weight="600" fill="#8A6A3C">No decision</text>
  <text x="454" y="133" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#56534C">“Next quarter” inertia</text>

  <!-- Transition Divider -->
  <line x1="28" y1="184" x2="184" y2="184" stroke="#E5E0D7" stroke-width="1"/>
  <text x="320" y="188" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#8A6A3C">TWO DELIVERABLES THAT UNLOCK CLARITY</text>
  <line x1="456" y1="184" x2="612" y2="184" stroke="#E5E0D7" stroke-width="1"/>

  <!-- Left Pillar: Business Case -->
  <rect x="28" y="204" width="280" height="150" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <rect x="28" y="204" width="280" height="3.5" fill="#8A6A3C"/>
  <text x="46" y="229" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#8A6A3C">PILLAR 01 · FINANCE &amp; BOARD</text>
  <text x="46" y="253" font-family="Newsreader, Georgia, serif" font-size="19" fill="#191814">The Business Case</text>
  <line x1="46" y1="265" x2="290" y2="265" stroke="#ECE8DF" stroke-width="1"/>
  <text x="46" y="286" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#56534C">· Deterministic fiscal &amp; TSU savings</text>
  <text x="46" y="308" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#56534C">· Benefit utilisation &amp; retention ROI</text>
  <text x="46" y="330" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#56534C">· Cost of action vs. cost of inaction</text>

  <!-- Right Pillar: Execution Blueprint -->
  <rect x="332" y="204" width="280" height="150" fill="#FBFAF7" stroke="#DCD7CE" stroke-width="1"/>
  <rect x="332" y="204" width="280" height="3.5" fill="#191814"/>
  <text x="350" y="229" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#56534C">PILLAR 02 · HR, PAYROLL &amp; OPS</text>
  <text x="350" y="253" font-family="Newsreader, Georgia, serif" font-size="19" fill="#191814">The Execution Blueprint</text>
  <line x1="350" y1="265" x2="594" y2="265" stroke="#ECE8DF" stroke-width="1"/>
  <text x="350" y="286" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#56534C">· Phased 6-week launch roadmap</text>
  <text x="350" y="308" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#56534C">· Named owners &amp; payroll dry run</text>
  <text x="350" y="330" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#56534C">· Employee adoption &amp; 90-day audit</text>

  <!-- Converging Connectors -->
  <path d="M 168 354 L 168 371 L 320 371 L 320 387" fill="none" stroke="#8A6A3C" stroke-width="1.4" marker-end="url(#arrow-bronze)"/>
  <path d="M 472 354 L 472 371 L 320 371" fill="none" stroke="#8A6A3C" stroke-width="1.4"/>

  <!-- Outcome Banner -->
  <rect x="28" y="390" width="584" height="44" fill="#F3EEE5" stroke="#8A6A3C" stroke-width="1"/>
  <text x="320" y="410" text-anchor="middle" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.1" fill="#191814">INFORMED COMMITTEE DECISION</text>
  <text x="320" y="426" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13" fill="#56534C">Finance can defend the return; Operations can defend the transition.</text>
</svg>
